# Telary Color backend — Alembic configuration.
# Run from the backend dir via the venv:  .venv/bin/python -m alembic upgrade head
# The `sqlalchemy.url` value here is a fallback only; env.py prefers the
# DATABASE_URL environment variable (used by tests) and then app settings.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./data/app.db  # fallback; entry.py passes DATABASE_URL env var

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
