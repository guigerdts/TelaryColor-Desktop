# Build the Telary Color backend as a self-contained Windows binary.
#
# Primary freezer is Nuitka (standalone, MSVC preinstalled on windows-latest);
# PyInstaller is the documented fallback (see uitka-build/stage_dist.py
# --freezer pyinstaller). This workflow is CI-only: it builds, stages, smoke-
# validates and uploads an artifact. It never publishes a release and needs
# no secrets — permissions are explicitly limited to `contents: read`.

name: Build Backend (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'uitka-build/**'
      - 'frontend/dist/**'
      - '.github/workflows/build-backend-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Install runtime dependencies
        run: pip install -r backend/requirements.txt

      - name: Install build-only dependencies (nuitka, pyinstaller)
        run: pip install -r backend/requirements-build.txt

      - name: Verify cp313 dependency wheels
        # git-bash heredoc: pwsh (default shell on windows-latest) has no
        # `<<'EOF'`, so this step pins `shell: bash` explicitly.
        shell: bash
        run: |
          python -VV
          python - <<'EOF'
          import importlib.metadata as md
          import sys

          assert sys.version_info[:2] == (3, 13), f"runner Python is {sys.version_info}"

          def _wheel_tags(dist):
              wheel = dist.read_text("WHEEL") or ""
              return [ln.split(":", 1)[1].strip()
                      for ln in wheel.splitlines() if ln.startswith("Tag:")]

          problems = []
          for name in sorted({"pydantic-core", "bcrypt", "sqlalchemy"}):
              dist = md.distribution(name)
              tags = _wheel_tags(dist)
              has_compiled = any(
                  f.suffix.lower() in {".pyd", ".so", ".dll"}
                  for f in (dist.files or [])
              )
              cp313 = any("cp313" in t for t in tags) or has_compiled
              print(f"{name}: cp313={cp313} tags={tags or 'none'} "
                    f"compiled={has_compiled}")
              if not cp313:
                  problems.append(name)

          if problems:
              raise SystemExit(
                  f"FAIL: compiled deps missing cp313 resolution: {problems}"
              )
          print("OK: Python 3.13.x with cp313 dependency wheels")
          EOF

      - name: Build backend with Nuitka (standalone, MSVC)
        run: python uitka-build/compile.py --output-dir build

      - name: Setup Node.js and build frontend SPA
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage distributable (binary + alembic + alembic.ini + frontend/dist)
        # Nuitka names the dist dir after the source file: entry.py → entry.dist/
        run: python uitka-build/stage_dist.py --exe build/entry.dist/telarycolor-server.exe

      - name: Smoke test staged binary
        run: python uitka-build/smoke_binary.py --exe build/entry.dist/telarycolor-server.exe --staged-dir build/entry.dist

      - name: Upload validated binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: telarycolor-server-windows
          path: build/entry.dist/
          if-no-files-found: error
          retention-days: 14
