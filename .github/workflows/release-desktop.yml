# Consolidated tag-triggered release pipeline for TelaryColor Desktop.
#
# On a v* tag push this single job builds the Nuitka backend, the Vite
# frontend, stages the distributable, packages the NSIS installer, and
# publishes to GitHub Releases.  Publish MUST be the last step — any
# earlier failure aborts before electron-builder runs (design D1).

name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Backend build (D2: verbatim from build-backend-windows.yml) ──

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Install runtime dependencies
        run: pip install -r backend/requirements.txt

      - name: Install build-only dependencies (nuitka, pyinstaller)
        run: pip install -r backend/requirements-build.txt

      - name: Verify cp313 dependency wheels
        shell: bash
        run: |
          python -VV
          python - <<'EOF'
          import importlib.metadata as md
          import sys

          assert sys.version_info[:2] == (3, 13), f"runner Python is {sys.version_info}"

          def _wheel_tags(dist):
              wheel = dist.read_text("WHEEL") or ""
              return [ln.split(":", 1)[1].strip()
                      for ln in wheel.splitlines() if ln.startswith("Tag:")]

          problems = []
          for name in sorted({"pydantic-core", "bcrypt", "sqlalchemy"}):
              dist = md.distribution(name)
              tags = _wheel_tags(dist)
              has_compiled = any(
                  f.suffix.lower() in {".pyd", ".so", ".dll"}
                  for f in (dist.files or [])
              )
              cp313 = any("cp313" in t for t in tags) or has_compiled
              print(f"{name}: cp313={cp313} tags={tags or 'none'} "
                    f"compiled={has_compiled}")
              if not cp313:
                  problems.append(name)

          if problems:
              raise SystemExit(
                  f"FAIL: compiled deps missing cp313 resolution: {problems}"
              )
          print("OK: Python 3.13.x with cp313 dependency wheels")
          EOF

      - name: Build backend with Nuitka (standalone, MSVC)
        run: python uitka-build/compile.py --output-dir build

      # ── Frontend build ──

      - name: Setup Node.js and build frontend SPA
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Stage + smoke ──

      - name: Stage distributable (binary + alembic + alembic.ini + frontend/dist)
        run: python uitka-build/stage_dist.py --exe build/entry.dist/telarycolor-server.exe

      - name: Smoke test staged binary
        run: python uitka-build/smoke_binary.py --exe build/entry.dist/telarycolor-server.exe --staged-dir build/entry.dist --max-size-mb 500

      # ── Version derivation from tag ──

      - name: Derive version from tag
        run: node scripts/derive-version.mjs ${{ github.ref_name }}

      # ── Electron package + test + publish ──

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Electron main-process tests
        working-directory: electron
        run: npm test

      - name: Package and publish installer
        working-directory: electron
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Post-publish verification (publish is LAST) ──

      - name: Verify packaged layout
        shell: bash
        run: |
          BACKEND_DIR="electron/dist/win-unpacked/resources/backend"
          echo "Checking packaged layout in $BACKEND_DIR ..."

          if [ ! -d "$BACKEND_DIR" ]; then
            echo "::error::resources/backend/ directory not found — entry.dist naming may be wrong"
            find electron/dist/win-unpacked/resources/ -maxdepth 2 -type d 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$BACKEND_DIR/alembic.ini" ]; then
            echo "::error::alembic.ini missing from resources/backend/ — migrations will fail"
            ls -la "$BACKEND_DIR/" 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$BACKEND_DIR/frontend/dist/index.html" ]; then
            echo "::error::frontend/dist/index.html missing — SPA will 404"
            ls -la "$BACKEND_DIR/frontend/dist/" 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$BACKEND_DIR/telarycolor-server.exe" ]; then
            echo "::error::telarycolor-server.exe not found in resources/backend/"
            ls -la "$BACKEND_DIR/" 2>/dev/null || true
            exit 1
          fi

          echo "OK: all 4 layout checks passed"
          echo "  - entry.dist naming: resources/backend/ exists"
          echo "  - alembic.ini: present"
          echo "  - frontend/dist/index.html: present"
          echo "  - telarycolor-server.exe: present"

      - name: Check installer size ≤ 500 MB
        shell: bash
        run: |
          INSTALLER=$(ls electron/dist/TelaryColor-Setup-*.exe 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::error::No installer exe found in electron/dist/"
            ls -la electron/dist/ 2>/dev/null || true
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$INSTALLER" 2>/dev/null || stat -f%z "$INSTALLER")
          SIZE_MB=$((SIZE_BYTES / 1048576))
          echo "Installer: $INSTALLER — ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "::error::Installer is ${SIZE_MB} MB, exceeding the 500 MB gate"
            exit 1
          fi
          echo "OK: installer ≤ 500 MB (${SIZE_MB} MB)"

      - name: Smoke test packaged backend
        run: python uitka-build/smoke_binary.py --exe electron/dist/win-unpacked/resources/backend/telarycolor-server.exe --packaged

      - name: Verify release asset exists
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          echo "Checking release assets for tag $TAG ..."
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>&1)
          if echo "$ASSETS" | grep -q "TelaryColor-Setup-"; then
            echo "OK: installer asset found in release $TAG"
            echo "$ASSETS"
          else
            echo "::error::No TelaryColor-Setup-*.exe asset found in release $TAG"
            echo "Assets found: $ASSETS"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
