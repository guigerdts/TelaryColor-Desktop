# Fast-feedback PR validation workflow for TelaryColor Desktop.
#
# Runs backend pytest, frontend vitest, and frontend build on every PR to
# main. Uses free ubuntu-latest runners, read-only permissions, and no
# secrets. This is a fast-feedback complement to the tag-gated release
# pipeline (release-desktop.yml), NOT a substitute for it: it never compiles
# with Nuitka, never packages an installer, never publishes, and never runs on
# Windows.

name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
