schema: spec-driven

context: |
  Product: Telary Color — color formula manager for Telary Home's paint area.
  Stack: FastAPI (Python) backend, React + Vite + Tailwind frontend (PWA),
  SQLite with SQLAlchemy 2.0 + Alembic, JWT auth (bcrypt password hashing).
  Architecture: modular monolith — independent modules for formulas,
  samples, inventory, users; clean REST API / OpenAPI via FastAPI.
  Audit: all data-mutating actions logged to access_logs.
  Scope: Phase 1 MVP (login, Pantone color CRUD + formulas, instant search).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale (ADR)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Keep modular boundaries (formulas, samples, inventory, users)
    tdd: true
    test_command: "pytest"
    frontend_test_command: "npm test"
  verify:
    test_command: "pytest"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

# Testing capabilities (detected by sdd-init).
# NOTE: two independent projects (backend/ + frontend/) with separate test
# runners and commands; there is NO single workspace-wide test command that
# covers every in-scope project. Per sdd-init Decision Gates, workspace-level
# strict_tdd fails closed to false. Strict TDD is enforced PER-PROJECT using
# each project's own command (below). sdd-apply/sdd-verify must pass the
# per-project command for the slice they touch.
testing:
  strict_tdd: false          # workspace-level: no single command covers all projects
  per_project_strict_tdd: true
  backend:
    runner: pytest
    command: "backend/.venv/bin/python -m pytest"
    test_dirs: ["backend/tests/"]
    coverage: "backend/.venv/bin/python -m pytest --cov"
  frontend:
    runner: vitest
    command: "npm test"       # run from frontend/ -> vitest run
    coverage: "npm test -- --coverage"
